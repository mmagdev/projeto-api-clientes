spring:
  application:
    name: clientesApi

  datasource:
    url: jdbc:postgresql://localhost:5432/clientes_db
    username: coti
    password: coti
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: localhost
    port: 5672
    username: coti
    password: coti

server:
  port: 8088